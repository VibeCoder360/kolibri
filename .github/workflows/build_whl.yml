name: Build WHL file
on:
  workflow_call:
    outputs:
      whl-file-name:
        description: "WHL file name"
        value: ${{ jobs.build_whl.outputs.whl-file-name }}
      tar-file-name:
        description: "TAR file name"
        value: ${{ jobs.build_whl.outputs.tar-file-name }}
permissions:
  contents: read
jobs:
  build_whl:
    name: Build WHL
    runs-on: ubuntu-latest
    outputs:
      whl-file-name: ${{ steps.get-whl-filename.outputs.whl-file-name }}
      tar-file-name: ${{ steps.get-tar-filename.outputs.tar-file-name }}
    steps:
      - name: Install Ubuntu dependencies
        run: |
          sudo apt-get -y -qq update
          sudo apt-get install -y gettext sqlite3 binutils-aarch64-linux-gnu binutils-arm-linux-gnueabihf
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
          lfs: true
      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          cache-python: true
      - name: Install pnpm
        uses: pnpm/action-setup@v6.0.8
      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: 'package.json'
          cache: 'pnpm'
      - name: Install Javascript dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Python dependencies
        run: uv sync --group dev
      - name: Set Kolibri version from tag (fork override)
        # School fork customization: the upstream pyproject.toml tag_regex only
        # accepts vX.Y.Z or vX.Y.Z-{alpha,beta,rc}N. Our school tags
        # (v0.19.4-schoolN) don't match, which makes setuptools-scm 9.x assert
        # at parse time. SETUPTOOLS_SCM_PRETEND_VERSION bypasses parsing entirely.
        # See SCHOOL_FORK_CHANGES.md.
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          VERSION="${VERSION//-school/.post}"
          echo "Pretending version: $VERSION (from tag $GITHUB_REF_NAME)"
          echo "SETUPTOOLS_SCM_PRETEND_VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Build Kolibri
        run: make dist
      - name: Get WHL filename
        id: get-whl-filename
        run: echo "whl-file-name=$(basename dist/*.whl)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.get-whl-filename.outputs.whl-file-name }}
          path: dist/${{ steps.get-whl-filename.outputs.whl-file-name }}
      - name: Get TAR filename
        id: get-tar-filename
        run: echo "tar-file-name=$(basename dist/*.tar.gz)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.get-tar-filename.outputs.tar-file-name }}
          path: dist/${{ steps.get-tar-filename.outputs.tar-file-name }}
