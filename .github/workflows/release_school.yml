name: Release Kolibri (School Fork)
# Fork-specific release workflow for VibeCoder360/kolibri.
# Produces unsigned Windows EXE and debug-signed Android APK + WHL/TAR/PEX.
# No code signing, no PyPI/Play Store/GCS publishing, no manual approval gate.
# See SCHOOL_FORK_CHANGES.md for the full rationale.
on:
  release:
    types: [published]
permissions:
  contents: write
jobs:
  whl:
    name: Build WHL file
    uses: ./.github/workflows/build_whl.yml
  upload_whl:
    uses: ./.github/workflows/upload_github_release_asset.yml
    needs: whl
    with:
      filename: ${{ needs.whl.outputs.whl-file-name }}
      release_id: ${{ github.event.release.id }}
  upload_tar:
    uses: ./.github/workflows/upload_github_release_asset.yml
    needs: whl
    with:
      filename: ${{ needs.whl.outputs.tar-file-name }}
      release_id: ${{ github.event.release.id }}
  pex:
    name: Build PEX file
    needs: whl
    uses: ./.github/workflows/build_pex.yml
    with:
      whl-file-name: ${{ needs.whl.outputs.whl-file-name }}
  upload_pex:
    uses: ./.github/workflows/upload_github_release_asset.yml
    needs: pex
    with:
      filename: ${{ needs.pex.outputs.pex-file-name }}
      release_id: ${{ github.event.release.id }}
  exe:
    name: Build EXE file (unsigned)
    needs: whl
    uses: learningequality/kolibri-installer-windows/.github/workflows/build_exe.yml@v1.6.9
    with:
      whl-file-name: ${{ needs.whl.outputs.whl-file-name }}
      release: false
      ref: v1.6.9
  upload_exe:
    uses: ./.github/workflows/upload_github_release_asset.yml
    needs: exe
    with:
      filename: ${{ needs.exe.outputs.exe-file-name }}
      release_id: ${{ github.event.release.id }}
  apk:
    name: Build Android APK (debug-signed)
    needs: whl
    uses: learningequality/kolibri-installer-android/.github/workflows/build_apk.yml@v0.1.10
    with:
      tar-file-name: ${{ needs.whl.outputs.tar-file-name }}
      ref: v0.1.10
  upload_apk:
    uses: ./.github/workflows/upload_github_release_asset.yml
    needs: apk
    with:
      filename: ${{ needs.apk.outputs.apk-file-name }}
      release_id: ${{ github.event.release.id }}
